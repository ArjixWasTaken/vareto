[package]
name = "vareto"
version = "0.1.0"
edition = "2024"
description = "SSH-tunnelling database MCP server (MySQL/MariaDB, PostgreSQL, MongoDB, Redis)"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
boa_engine = { version = "=0.22.0", default-features = false }
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
comfy-table = "=8.0.1"
csv = "1.4.0"
directories = "6.0.0"
fake = "5.1.0"
futures = "0.3.34"
hmac = "0.13"
globset = "0.4.20"
keyring = "4.2.0"
mongodb = "3.9.1"
nix = { version = "0.31.3", features = ["process", "signal", "fs", "user", "hostname", "socket", "uio"] }
percent-encoding = "2.3.2"
rand = { version = "0.10", default-features = false, features = ["std"] }
redis = { version = "1.7.1", features = ["tokio-comp", "connection-manager"] }
regex = "1.13.1"
rmcp = { version = "3.5.1", features = ["server", "transport-io", "macros"] }
rpassword = "7.5.4"
russh = "0.64.1"
rustyline = { version = "=18.0.1", default-features = false, features = ["with-file-history"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlparser = { version = "0.63.0", features = ["visitor"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "mysql", "postgres", "json", "chrono", "uuid", "rust_decimal", "time", "sqlite"] }
ssh2-config = "0.8.2"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["codec"] }
toml = "1.1.8"
toml_edit = "0.25.17"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
strip = true
lto = "thin"
